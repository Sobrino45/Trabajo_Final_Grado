<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Casino DAW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="bg-dark text-light">

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <main class="container py-5">
    <h1 class="mb-4">Dashboard</h1>

    <section id="userInfo" class="mb-4">
      <p><strong>Usuario:</strong> <span id="username"></span></p>
      <p><strong>Saldo:</strong> <span id="saldo"></span> €</p>
    </section>

    <section id="actions" class="d-flex gap-3">
      <a href="../RuletaJava/ruleta.html" class="btn btn-casino">
        🎡 Jugar a la Ruleta
      </a>

      <button class="btn btn-outline-light" onclick="logout()">
        Cerrar sesión
      </button>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Auth -->
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/logout.js"></script>

  <!-- Navbar + Wallet -->
  <script>
    fetch("partials/navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbar").innerHTML = html;

        const script = document.createElement("script");
        script.src = "js/wallet.js";
        document.body.appendChild(script);
      });
  </script>

</body>
</html>
