<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro | Casino DAW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="icon" type="image/png" href="/CasinoDaw/Portal/assets/img/icons/logo-casino.png">
</head>

<body class="bg-dark text-light">

  <div id="navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h1 class="mb-4 text-center">Crear cuenta</h1>

        <div class="card bg-secondary text-light shadow-lg border-0">
            <div class="card-body p-4">
                <form id="registerForm">
                  
                  <div class="row">
                      <div class="col-md-6 mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" id="username" class="form-control" placeholder="Ej: Player1" required />
                      </div>
                      
                      <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required />
                      </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="******" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="******" required />
                  </div>

                  <hr class="border-light opacity-25">

                  <div class="mb-4">
                    <label class="form-label text-warning fw-bold">💰 Saldo inicial (€)</label>
                    <input type="number" id="saldo" class="form-control" min="10" max="10000" value="1000" required />
                    <div class="form-text text-light opacity-75">Dinero simulado para empezar.</div>
                  </div>

                  <button type="submit" class="btn btn-warning w-100 fw-bold">Registrarse y Jugar</button>
                  
                  <div id="msgContainer" class="mt-3 text-center" style="display: none;"></div>
                </form>
            </div>
        </div>

        <div class="mt-3 text-center">
             <p>¿Ya tienes cuenta? <a href="login.html" class="text-info">Inicia sesión</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/wallet.js"></script>
  <script src="assets/js/logout.js"></script>
  
  <script src="assets/js/register.js"></script>
  
  <script>
    fetch("partials/navbar.html")
      .then((response) => response.text())
      .then((html) => {
        document.getElementById("navbar").innerHTML = html;
        NavbarManager.init();
      });
  </script>

</body>
</html>
