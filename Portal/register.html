<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro | Casino DAW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body class="bg-dark text-light">

  <div id="navbar"></div>

  <main class="container py-5">
    <h1 class="mb-4">Registro de usuario</h1>

    <form id="registerForm" class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" id="username" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" class="form-control" required />
      </div>

      <div class="mb-4">
        <label class="form-label">Saldo inicial (€)</label>
        <input type="number" id="saldo" class="form-control" min="10" max="10000" required />
      </div>

      <button class="btn btn-casino">Registrarse</button>
      <p id="error" class="text-danger mt-3"></p>
    </form>
  </main>

  <script src="js/register.js"></script>
  <script>
    fetch("partials/navbar.html")
      .then(r => r.text())
      .then(t => document.getElementById("navbar").innerHTML = t);
  </script>

</body>
</html>
