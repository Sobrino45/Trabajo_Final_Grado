<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="icon" type="image/png" href="/CasinoDaw/Portal/assets/img/icons/logo-casino.png">

  </head>

  <body class="page-login bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <h1 class="mb-4 text-center">Iniciar sesión</h1>

          <div class="card bg-secondary text-light shadow-lg">
            <div class="card-body p-4">
              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginUser" class="form-label"
                    >Usuario o Correo Electrónico</label
                  >
                  <input
                    type="text"
                    id="loginUser"
                    class="form-control"
                    placeholder="Ej: JugadorPrueba o test@casino.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="******"
                    required
                  />
                </div>

                <div class="form-check mb-3">
                  <input
                    type="checkbox"
                    id="rememberUser"
                    class="form-check-input"
                  />
                  <label class="form-check-label" for="rememberUser"
                    >Recordar usuario</label
                  >
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Entrar
                </button>

                <p
                  id="error"
                  class="text-danger mt-3 text-center"
                  style="display: none"
                ></p>
              </form>
            </div>
          </div>

          <div class="mt-3 text-center">
            <p>
              ¿No tienes cuenta?
              <a href="register.html" class="text-info">Regístrate aquí</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/wallet.js"></script>
    <script src="assets/js/logout.js"></script>

    <script src="assets/js/login.js"></script>

    <script>
      fetch("partials/navbar.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
          NavbarManager.init();
        });
    </script>
  </body>
</html>
