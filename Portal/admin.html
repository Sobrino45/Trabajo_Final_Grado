<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin | Casino DAW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">👮 Panel de Administración</span>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Volver al Casino</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card text-white bg-primary shadow">
                    <div class="card-body">
                        <h5 class="card-title">Usuarios Registrados</h5>
                        <h2 class="display-4 fw-bold" id="totalUsers">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-white bg-danger shadow">
                    <div class="card-body">
                        <h5 class="card-title">Dinero en manos de jugadores</h5>
                        <h2 class="display-4 fw-bold"><span id="totalMoney">0.00</span> €</h2>
                        <small>Esto es lo que el casino debe pagar si todos retiran.</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header bg-white">
                <h4 class="mb-0">Gestión de Usuarios</h4>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Saldo Actual</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Cargar datos al iniciar
        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosAdmin();
        });

        function cargarDatosAdmin() {
            fetch('../Backend/admin_data.php')
                .then(r => r.json())
                .then(data => {
                    if (!data.access) {
                        alert("No tienes permiso de administrador.");
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    // Actualizar Estadísticas
                    document.getElementById('totalUsers').textContent = data.stats.total_usuarios;
                    document.getElementById('totalMoney').textContent = data.stats.dinero_en_juego.toFixed(2);

                    // Rellenar Tabla
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = ''; // Limpiar
                    
                    data.usuarios.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>#${user.id}</td>
                            <td class="fw-bold">${user.username}</td>
                            <td>${user.email}</td>
                            <td class="text-success fw-bold">${parseFloat(user.saldo).toFixed(2)} €</td>
                            <td>
                                <button onclick="borrarUsuario(${user.id})" class="btn btn-danger btn-sm">
                                    🗑️ Borrar
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function borrarUsuario(id) {
            if(!confirm("¿Seguro que quieres eliminar a este usuario? Esta acción no se puede deshacer.")) return;

            fetch('../Backend/delete_user.php', {
                method: 'POST',
                body: JSON.stringify({ id: id }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    cargarDatosAdmin(); // Recargar tabla
                } else {
                    alert("Error al borrar");
                }
            });
        }
    </script>
</body>
</html>
