<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash | Casino DAW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Portal/assets/css/main.css">
    <link rel="stylesheet" href="crash.css">
</head>
<body class="bg-dark text-light">

    <div id="navbar"></div>

    <main class="container py-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="../Portal/dashboard.html" class="btn btn-outline-secondary btn-sm">
                ⬅ Volver
            </a>
            
            <div class="bg-black border border-secondary rounded px-3 py-1 d-flex align-items-center gap-2 shadow-inset">
                <span class="text-uppercase small text-secondary fw-bold" style="font-size: 0.7rem;">Tu Saldo:</span>
                <span id="walletDisplay" class="text-success fw-bold font-monospace fs-5">...</span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card bg-black border-secondary shadow-lg overflow-hidden position-relative" style="height: 500px;">
                    
                    <div class="position-absolute top-50 start-50 translate-middle text-center z-3 pointer-events-none">
                        <h1 id="multiplierDisplay" class="display-1 fw-bold text-white mb-0" style="font-size: 5rem;">1.00x</h1>
                        <p id="statusText" class="text-uppercase fw-bold text-secondary small tracking-widest">Esperando...</p>
                    </div>

                    <canvas id="crashGraph" width="800" height="500"></canvas>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card bg-secondary text-white border-0 h-100 shadow-sm">
                    <div class="card-header bg-black border-bottom border-secondary">
                        <h5 class="m-0 text-warning">🚀 Panel de Control</h5>
                    </div>
                    <div class="card-body d-flex flex-column gap-3">
                        
                        <div>
                            <label class="form-label text-white-50 fw-bold small">Importe Apuesta (€)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-dark border-secondary text-secondary">€</span>
                                <input type="number" id="betInput" class="form-control bg-dark text-white border-secondary fw-bold" value="10" min="1">
                            </div>
                            <div class="d-flex gap-2 mt-2">
                                <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="setBet(10)">10</button>
                                <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="setBet(50)">50</button>
                                <button class="btn btn-sm btn-outline-secondary flex-fill" onclick="setBet(100)">100</button>
                                <button class="btn btn-sm btn-outline-warning flex-fill" onclick="doubleBet()">x2</button>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <button id="btnAction" class="btn btn-success w-100 py-4 fw-bold text-uppercase fs-4 shadow-lg border-0 position-relative overflow-hidden">
                                <span class="position-relative z-1">APOSTAR</span>
                            </button>
                        </div>
                        
                        <div class="bg-dark rounded p-3 border border-secondary mt-3">
                            <small class="text-white-50 d-block mb-1">Último Crash:</small>
                            <div id="history" class="d-flex gap-2 flex-wrap justify-content-start">
                                <span class="badge bg-danger">1.10x</span>
                                <span class="badge bg-success">5.45x</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </main>

    <div id="footer"></div>

    <script src="crash.js"></script>

    <script>
        fetch("../Portal/partials/navbar.html").then(r => r.text()).then(h => {
            document.getElementById("navbar").innerHTML = h;
        });
        fetch("../Portal/partials/footer.html").then(r => r.text()).then(h => document.getElementById("footer").innerHTML = h);
    </script>
</body>
</html>
