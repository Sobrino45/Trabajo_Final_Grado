<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../Portal/assets/css/main.css">
    
    <link rel="stylesheet" href="ruleta.css">
</head>
<body class="bg-dark text-light">

    <div id="navbar"></div>

    <main class="container py-5">
        <div class="row g-5">
            
            <div class="col-lg-5 text-center">
                <h1 class="mb-4 display-6">🎰 Ruleta Europea</h1>
                
                <div class="ruleta-container d-inline-block position-relative mb-4">
                    <div class="flecha">▼</div>
                    <div id="ruleta" class="ruleta"></div>
                </div>

                <div class="card bg-secondary text-white shadow-sm mt-3">
                    <div class="card-body">
                        <h5 class="card-title">Últimos Resultados</h5>
                        <div id="resultados" class="d-flex justify-content-center gap-2 flex-wrap"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card bg-secondary text-white border-0 shadow-lg">
                    <div class="card-header bg-black border-secondary">
                        <h4 class="m-0">Panel de Apuestas</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4 d-flex gap-3 align-items-end">
                            <div class="flex-grow-1">
                                <label class="form-label text-warning fw-bold">Cantidad a apostar (€)</label>
                                <input type="number" id="cantidad" class="form-control form-control-lg" min="1" value="10" placeholder="€">
                            </div>
                            <button id="girar" class="btn btn-warning btn-lg fw-bold px-4">
                                ¡GIRAR! 🎡
                            </button>
                        </div>

                        <hr class="border-light opacity-25">

                        <div class="mb-4">
                            <h5 class="mb-2">Números</h5>
                            <div id="numeros" class="d-flex flex-wrap gap-1 justify-content-center"></div>
                        </div>

                        <div class="mb-4">
                            <h5 class="mb-2">Apuestas Rápidas</h5>
                            <div class="d-flex gap-2 flex-wrap justify-content-center">
                                <button data-tipo="color" data-valor="rojo" class="btn btn-danger w-25">Rojo</button>
                                <button data-tipo="color" data-valor="negro" class="btn btn-dark border w-25">Negro</button>
                                <button data-tipo="paridad" data-valor="par" class="btn btn-outline-light">Par</button>
                                <button data-tipo="paridad" data-valor="impar" class="btn btn-outline-light">Impar</button>
                                <button data-tipo="rango" data-valor="1-18" class="btn btn-outline-light">1-18</button>
                                <button data-tipo="rango" data-valor="19-36" class="btn btn-outline-light">19-36</button>
                            </div>
                        </div>

                        <div class="alert alert-dark border-secondary">
                            <h6 class="text-info">Apuestas en mesa:</h6>
                            <ul id="listaApuestas" class="mb-0 ps-3 small"></ul>
                        </div>
                        
                        <h3 id="resultado" class="text-center text-warning mt-3 fw-bold min-h-50"></h3>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../Portal/assets/js/auth.js"></script>
    <script src="../Portal/assets/js/wallet.js"></script>
    <script src="../Portal/assets/js/logout.js"></script>

    <script src="ruleta.js"></script>

    <script>
        // Cargar Navbar del Portal
        fetch("../Portal/partials/navbar.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;
                NavbarManager.init(); // Inicializar lógica del navbar
            });
    </script>
</body>
</html>
