<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta - Casino DAW</title>
    <link rel="stylesheet" href="ruleta.css">
</head>
<body>

<div class="app">

    <h1>🎰 Ruleta</h1>

    <!-- RULETA -->
    <div class="ruleta-wrapper">
        <div class="flecha">▼</div>
        <div id="ruleta" class="ruleta"></div>
    </div>

    <!-- PANEL DE APUESTAS -->
    <section class="panel-apuestas">
        <h2>Apuestas</h2>

        <input type="number" id="cantidad" min="1" placeholder="€ apuesta">

        <div class="tablero">
            <!-- NÚMEROS -->
            <div class="bloque">
                <h3>Números</h3>
                <div id="numeros"></div>
            </div>

            <!-- APUESTAS SIMPLES -->
            <div class="bloque">
                <h3>Apuestas simples</h3>
                <button data-tipo="color" data-valor="rojo" class="rojo">Rojo</button>
                <button data-tipo="color" data-valor="negro" class="negro">Negro</button>
                <button data-tipo="paridad" data-valor="par">Par</button>
                <button data-tipo="paridad" data-valor="impar">Impar</button>
                <button data-tipo="rango" data-valor="1-18">1–18</button>
                <button data-tipo="rango" data-valor="19-36">19–36</button>
            </div>
        </div>

        <ul id="listaApuestas"></ul>
    </section>

    <button id="girar">Girar ruleta</button>
    <p id="resultado"></p>

    <!-- HISTORIAL -->
    <section class="historial">
        <h3>Últimos resultados</h3>
        <div id="resultados"></div>
    </section>

</div>

<script src="ruleta.js"></script>
</body>
</html>
