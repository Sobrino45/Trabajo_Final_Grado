<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />

    <link rel="icon" type="image/png" href="assets/img/icons/logo-casino.png" />
  </head>

  <body class="page-dashboard bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="row align-items-center mb-5">
        <div class="col-md-8">
          <h1 class="display-5">
            Hola, <span id="username" class="text-warning">Cargando...</span>
          </h1>
          <p class="lead mb-3">Bienvenido de nuevo a tu panel de control.</p>
          <div class="d-flex align-items-center gap-3">
            <button
              id="btnDashboardLogout"
              class="btn btn-outline-danger btn-sm d-inline-flex align-items-center gap-2"
            >
              🚪 Cerrar Sesión
            </button>
            <div id="admin-btn-container"></div>
          </div>
        </div>

        <div class="col-md-4 text-md-end mt-3 mt-md-0">
          <div class="card bg-secondary text-white shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Tu Saldo</h5>
              <h2 class="display-6 fw-bold"><span id="saldo">--.--</span> €</h2>
            </div>
          </div>
        </div>
      </div>

      <section class="mb-5 p-4 bg-darker rounded border border-secondary">
        <h3 class="mb-3">💰 Gestión de Billetera</h3>
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="depositAmount" class="form-label"
              >Ingresar cantidad (€)</label
            >
            <input
              type="number"
              id="depositAmount"
              class="form-control"
              placeholder="Ej: 500"
              min="1"
            />
          </div>
          <div class="col-md-3">
            <button id="btnDeposit" class="btn btn-success w-100">
              Ingresar Saldo
            </button>
          </div>
        </div>
      </section>

      <section>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="m-0">🎮 Juegos Disponibles</h3>
          <a href="Instrucciones/index.html" class="btn btn-outline-info btn-sm"
            >📘 Ver Reglas</a
          >
        </div>

        <div class="row g-4">
          <div class="col-md-4">
            <div
              class="card h-100 bg-secondary text-white border-0 shadow hover-scale"
            >
              <div class="card-body text-center">
                <div class="display-1 mb-3">🎡</div>
                <h4 class="card-title">Ruleta Europea</h4>
                <a
                  href="games/Ruleta/index.html"
                  class="btn btn-warning w-100 fw-bold text-dark"
                  >Jugar Ahora</a
                >
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card h-100 bg-secondary text-white border-0 shadow hover-scale"
            >
              <div class="card-body text-center">
                <div class="display-1 mb-3">🎰</div>
                <h4 class="card-title">Tragaperras</h4>
                <a
                  href="games/Tragaperras/index.html"
                  class="btn btn-danger w-100 fw-bold"
                  >Jugar Ahora</a
                >
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card h-100 bg-secondary text-white border-warning shadow hover-scale"
            >
              <div class="card-body text-center">
                <div class="display-1 mb-3">🚀</div>
                <h4 class="card-title">
                  CRASH
                  <span class="badge bg-warning text-dark ms-1">NUEVO</span>
                </h4>
                <a
                  href="games/Crash/index.html"
                  class="btn btn-warning w-100 fw-bold text-dark"
                  >Jugar Ahora</a
                >
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card h-100 bg-secondary text-white border-0 shadow hover-scale"
            >
              <div class="card-body text-center">
                <div class="display-1 mb-3">🃏</div>
                <h4 class="card-title">Blackjack</h4>
                <a
                  href="games/Blackjack/index.html"
                  class="btn btn-success w-100 fw-bold"
                  >Jugar Ahora</a
                >
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card h-100 bg-secondary text-white border-0 shadow hover-scale"
            >
              <div class="card-body text-center">
                <div class="display-1 mb-3">🐎</div>
                <h4 class="card-title">Carrera Caballos</h4>
                <a
                  href="games/Carrera/index.html"
                  class="btn btn-primary w-100 fw-bold"
                  >Jugar Ahora</a
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="assets/js/auth.js"></script>
    <script src="assets/js/logout.js"></script>
    <script src="assets/js/navbar_logic.js"></script>

    <script>
      // 1. CARGA COORDINADA DEL NAVBAR
      // Primero cargamos el HTML, y solo cuando existe, arrancamos la lógica
      fetch("partials/navbar.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
          
          // Ahora que el HTML existe, despertamos al Manager
          if (window.NavbarManager) {
            console.log("✅ Navbar cargado. Iniciando Manager...");
            window.NavbarManager.init();
          }
        });

      // 2. CARGA DEL FOOTER
      fetch("partials/footer.html")
        .then((r) => r.text())
        .then((t) => (document.getElementById("footer").innerHTML = t));


      // 3. LÓGICA EXCLUSIVA DEL DASHBOARD (Caja Grande y Depósitos)
      document.addEventListener("DOMContentLoaded", () => {
        
        // A) Botón Logout del Dashboard (el rojo del centro)
        const btnLogoutDash = document.getElementById("btnDashboardLogout");
        if (btnLogoutDash) {
          btnLogoutDash.addEventListener("click", (e) => {
            e.preventDefault();
            window.location.href = 'api.php?action=logout';
          });
        }

        // B) Datos de la Caja Grande (Solo tocamos id="saldo", NO el navbar)
        fetch("api.php?action=get_user_info")
          .then((response) => response.json())
          .then((data) => {
            if (data.logged_in) {
              // Nombre grande
              const userElement = document.getElementById("username");
              if(userElement) userElement.textContent = data.username;
              
              // Caja Gris Grande (Tu Saldo)
              const saldoElement = document.getElementById("saldo");
              if(saldoElement) {
                 // Aseguramos que sea número
                 saldoElement.textContent = parseFloat(data.saldo).toFixed(2);
              }
              
              // Mostrar botón Admin si corresponde
              if (data.rol === "admin") {
                 const adminContainer = document.getElementById("admin-btn-container");
                 if(adminContainer) {
                    adminContainer.innerHTML = `
                      <a href="partials/admin.html" class="btn btn-outline-warning btn-sm d-inline-flex align-items-center gap-2 fw-bold">
                        👮 Panel Admin
                      </a>`;
                 }
              }
            } else {
              window.location.replace("login.html");
            }
          })
          .catch((error) => console.error("Error cargando Dashboard:", error));

        // C) Lógica de Depósito (Ingresar dinero)
        const btnDeposit = document.getElementById("btnDeposit");
        if (btnDeposit) {
          btnDeposit.addEventListener("click", () => {
            const amountInput = document.getElementById("depositAmount");
            const amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) return alert("Introduce una cantidad válida");

            fetch("api.php?action=deposit", {
              method: "POST",
              body: JSON.stringify({ amount: amount }),
              headers: { "Content-Type": "application/json" },
            })
              .then((r) => r.json())
              .then((data) => {
                if (data.success) {
                  alert("¡Recarga exitosa!");
                  amountInput.value = "";
                  // Actualizamos todo recargando la página o llamando al init
                  window.location.reload(); 
                } else {
                  alert("Error: " + (data.message || "No se pudo depositar"));
                }
              })
              .catch((err) => console.error("Error en depósito:", err));
          });
        }
      });
    </script>
  </body>
</html>
