<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      .achievement-card {
        opacity: 0.5;
        transition: 0.4s;
        border: 2px solid #333 !important;
        background: #111 !important;
        height: 100px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      .achievement-card.unlocked {
        opacity: 1;
        border-color: #ffc107 !important;
        background: linear-gradient(145deg, #1a1a1a, #222) !important;
        box-shadow: 0 0 15px rgba(255, 193, 7, 0.2);
        transform: scale(1.05);
      }
      .achievement-name {
        font-size: 0.7rem;
        font-weight: bold;
        margin-top: 5px;
        color: #666;
        text-align: center;
        text-transform: uppercase;
      }
      .unlocked .achievement-name {
        color: #ffc107;
      }
      .ranking-item {
        border-bottom: 1px solid #222;
        padding: 10px;
        font-size: 0.85rem;
      }
      .shadow-hover:hover {
        transform: translateY(-5px);
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
      }
      /* Estilos para la barra de prestigio neón */
      .user-status .progress-bar {
        transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 10px #f1c40f;
      }
      /* Estilos para el sistema de soporte flotante */
      .support-wrapper {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 1050;
      }
      .support-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f1c40f, #dc143c);
        border: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        font-size: 1.5rem;
        color: white;
        transition: transform 0.3s ease;
      }
      .support-btn:hover {
        transform: scale(1.1);
      }
      .support-dropdown {
        position: absolute;
        bottom: 75px;
        right: 0;
        width: 300px;
        background: #1a1a1a;
        border: 1px solid rgba(241, 196, 15, 0.3);
        border-radius: 12px;
        padding: 1.5rem;
        display: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .support-dropdown.show {
        display: block;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="row align-items-center mb-5">
        <div class="col-md-8">
          <h1 class="display-4 fw-bold">
            Hola, <span id="username" class="text-warning">...</span>
          </h1>

          <div id="user-status-container" class="mt-2"></div>

          <div class="d-flex gap-2 mt-3">
            <button onclick="logout()" class="btn btn-sm btn-outline-danger">
              Cerrar Sesión
            </button>
            <div id="admin-btn-container"></div>
          </div>
        </div>
        <div class="col-md-4 mt-4 mt-md-0">
          <div class="card balance-card text-white text-md-end p-4">
            <small class="text-uppercase opacity-75">Saldo Disponible</small>
            <h2 class="fw-bold mb-0 text-success">
              <span id="saldo">0.00</span> €
            </h2>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <section class="mb-5">
            <h4 class="mb-3 text-warning fw-bold text-uppercase small">
              <i class="bi bi-award"></i> Tus Medallas
            </h4>
            <div id="achievementsContainer" class="row g-2"></div>
          </section>

          <section
            class="mb-5 p-4 bg-dark rounded border border-secondary shadow-sm"
          >
            <h4 class="mb-4 text-info text-uppercase small fw-bold">
              Gestión de Saldo
            </h4>
            <div class="row g-3">
              <div class="col-md-4">
                <input
                  type="number"
                  id="walletAmount"
                  class="form-control bg-black text-white border-secondary"
                  placeholder="0.00"
                />
              </div>
              <div class="col-md-4 col-6">
                <button
                  onclick="procesar('deposit')"
                  class="btn btn-success w-100 fw-bold"
                >
                  📥 INGRESAR
                </button>
              </div>
              <div class="col-md-4 col-6">
                <button
                  onclick="procesar('withdraw')"
                  class="btn btn-danger w-100 fw-bold"
                >
                  📤 RETIRAR
                </button>
              </div>
            </div>
          </section>

          <section class="mb-5">
            <div class="card bg-black border-secondary shadow">
              <div class="card-header bg-dark border-secondary py-2">
                <h6 class="m-0 small fw-bold text-white-50 text-uppercase">
                  Historial Detallado
                </h6>
              </div>
              <div class="table-responsive">
                <table class="table table-dark table-hover mb-0 small">
                  <thead>
                    <tr class="text-white-50">
                      <th>Fecha</th>
                      <th>Tipo</th>
                      <th class="text-end">Monto</th>
                    </tr>
                  </thead>
                  <tbody id="txTableBody"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>

        <div class="col-lg-4">
          <div class="card bg-black border-warning shadow h-100">
            <div
              class="card-header bg-dark border-warning text-warning fw-bold small"
            >
              🏆 TOP 10 JUGADORES
            </div>
            <div id="leaderboardContainer" class="card-body p-0"></div>
          </div>
        </div>
      </div>

      <section class="py-5 mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="m-0 fw-bold text-uppercase small text-white-50">
            <i class="bi bi-controller"></i> Sala de Juegos
          </h3>
          <a
            href="../Instrucciones/index.html"
            class="btn btn-outline-info btn-sm fw-bold px-3"
          >
            <i class="bi bi-book"></i> REGLAS DEL CASINO
          </a>
        </div>

        <div class="row g-4 text-center">
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-4 mb-2">🎡</div>
              <h5>Ruleta</h5>
              <a
                href="games/Ruleta/index.html"
                class="btn btn-warning mt-auto fw-bold text-dark"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-4 mb-2">🎰</div>
              <h5>Tragaperras</h5>
              <a
                href="games/Tragaperras/index.html"
                class="btn btn-danger mt-auto fw-bold"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card bg-secondary border-warning h-100 p-4 shadow-hover"
            >
              <div class="display-4 mb-2">🚀</div>
              <h5>CRASH</h5>
              <a
                href="games/Crash/index.html"
                class="btn btn-warning mt-auto fw-bold text-dark"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card bg-primary bg-gradient border-0 h-100 p-4 shadow-hover"
            >
              <div class="display-4 mb-2">🃏</div>
              <h5>Poker Club</h5>
              <a
                href="games/Poker/index.html"
                class="btn btn-light mt-auto fw-bold text-primary"
                >ENTRAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-4 mb-2">♠️</div>
              <h5>Blackjack</h5>
              <a
                href="games/Blackjack/index.html"
                class="btn btn-success mt-auto fw-bold"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-4 mb-2">🐎</div>
              <h5>Carrera</h5>
              <a
                href="games/Carrera/index.html"
                class="btn btn-primary mt-auto fw-bold"
                >JUGAR</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="support-wrapper">
      <div id="supportBox" class="support-dropdown">
        <h6 class="text-warning mb-3 small fw-bold text-uppercase">
          📞 Soporte al Templo
        </h6>
        <textarea
          id="supportMsg"
          class="form-control mb-3 bg-black text-white border-secondary"
          rows="4"
          placeholder="Escribe tu duda al Admin..."
        ></textarea>
        <button
          onclick="enviarSoporte()"
          class="btn btn-warning btn-sm w-100 fw-bold"
        >
          ENVIAR DUDA
        </button>
      </div>
      <button onclick="toggleSupport()" class="support-btn">
        <i class="bi bi-chat-dots"></i>
      </button>
    </div>

    <footer id="footer"></footer>

    <script src="assets/js/AudioManager.js"></script>
    <script src="assets/js/navbar_logic.js"></script>
    <script>
      const API = "api.php";

      function cargarTodo() {
        fetch(`${API}?action=get_user_info&t=${Date.now()}`)
          .then((r) => r.json())
          .then((data) => {
            if (!data.logged_in) return window.location.replace("login.html");

            // Actualización sincronizada (Navbar + Cuerpo)
            const usernameElems = ["username", "nav-username"];
            const balanceElems = ["saldo", "nav-saldo"];

            usernameElems.forEach((id) => {
              const el = document.getElementById(id);
              if (el) el.textContent = data.username;
            });

            balanceElems.forEach((id) => {
              const el = document.getElementById(id);
              if (el) el.textContent = parseFloat(data.saldo).toFixed(2);
            });

            // Inyectar Estatus VIP y Barra de Prestigio
            const statusContainer = document.getElementById(
              "user-status-container",
            );
            if (statusContainer && data.rango) {
              statusContainer.innerHTML = `
                <div class="user-status">
                  <span class="badge bg-warning text-dark shadow-sm">${data.rango}</span>
                  <div class="progress mt-2" style="height: 6px; background: rgba(255,255,255,0.1); width: 250px;">
                    <div class="progress-bar bg-warning" style="width: ${data.progreso}%;"></div>
                  </div>
                </div>
              `;
            }

            if (data.rol === "admin" || data.rol === "owner") {
              const adminContainer = document.getElementById(
                "admin-btn-container",
              );
              if (adminContainer) {
                adminContainer.innerHTML = `<a href="partials/admin.html" class="btn btn-outline-warning btn-sm fw-bold">${data.rol.toUpperCase()}</a>`;
              }
            }
            cargarHistorial();
            cargarLogros();
            cargarRanking();
          });
      }

      function cargarHistorial() {
        fetch(`${API}?action=get_transactions`)
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("txTableBody").innerHTML = d.transacciones
              .map((t) => {
                let infoExtra = "";
                if (t.detalles_json) {
                  try {
                    const det = JSON.parse(t.detalles_json);
                    if (det.multiplicador)
                      infoExtra = `<br><span class="text-warning" style="font-size:0.6rem">🚀 Crash: ${det.multiplicador}x</span>`;
                    if (det.numero !== undefined)
                      infoExtra = `<br><span class="text-info" style="font-size:0.6rem">🎡 Ruleta: Nº ${det.numero}</span>`;
                  } catch (e) {}
                }
                const color =
                  t.tipo === "ganancia" || t.tipo === "ingreso"
                    ? "text-success"
                    : "text-danger";
                return `<tr><td>${new Date(t.fecha).toLocaleDateString()}</td><td class="text-uppercase fw-bold" style="font-size:0.7rem">${t.tipo.replace("_", " ")} ${infoExtra}</td><td class="text-end fw-bold ${color}">${parseFloat(t.cantidad).toFixed(2)} €</td></tr>`;
              })
              .join("");
          });
      }

      function cargarLogros() {
        fetch(`${API}?action=get_achievements`)
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("achievementsContainer").innerHTML =
              d.logros
                .map(
                  (l) => `
                <div class="col-md-2 col-4">
                  <div class="card achievement-card ${l.obtenido ? "unlocked" : ""}" title="${l.obtenido ? l.descripcion : "Logro bloqueado"}">
                    <div class="${l.obtenido ? "fs-2" : "mystery-icon"}">${l.obtenido ? l.icono || "❓" : "?"}</div>
                    <div class="achievement-name">${l.nombre}</div>
                  </div>
                </div>`,
                )
                .join("");
          });
      }

      function cargarRanking() {
        fetch(`${API}?action=get_leaderboard`)
          .then((r) => r.json())
          .then((d) => {
            document.getElementById("leaderboardContainer").innerHTML =
              d.ranking
                .map(
                  (u, i) => `
                <div class="ranking-item d-flex align-items-center">
                  <span class="fw-bold me-3 text-white-50">#${i + 1}</span>
                  <div class="flex-grow-1">
                    <strong>${u.username}</strong><br>
                    <small class="text-warning">${u.medallas} MEDALLAS</small>
                  </div>
                  <div class="text-success fw-bold">${Math.round(u.saldo)}€</div>
                </div>`,
                )
                .join("");
          });
      }

      function procesar(action) {
        const amtInput = document.getElementById("walletAmount");
        const amt = parseFloat(amtInput.value);
        if (isNaN(amt) || amt <= 0) return alert("Introduce un monto válido.");

        fetch(`api.php?action=${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: amt }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              amtInput.value = "";
              cargarTodo();
            } else {
              alert("Error: " + data.message);
            }
          })
          .catch((err) => {
            console.error("Error crítico:", err);
            alert("Error de conexión con el servidor.");
          });
      }

      function logout() {
        fetch(`${API}?action=logout`).then(() =>
          window.location.replace("index.html"),
        );
      }

      function toggleSupport() {
        document.getElementById("supportBox").classList.toggle("show");
      }

      function enviarSoporte() {
        const msgInput = document.getElementById("supportMsg");
        const msg = msgInput.value.trim();
        if (!msg) return alert("Por favor, escribe tu duda primero.");

        fetch(`${API}?action=send_support_ticket`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: msg }),
        })
          .then((r) => r.json())
          .then((data) => {
            if (data.success) {
              alert("✅ " + data.message);
              msgInput.value = "";
              toggleSupport();
            } else {
              alert("❌ " + data.message);
            }
          });
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("partials/navbar.html")
          .then((r) => r.text())
          .then((data) => {
            document.getElementById("navbar").innerHTML = data;
            // Forzar actualización una vez inyectado el navbar
            cargarTodo();
            if (window.NavbarManager) window.NavbarManager.init();
          });
        fetch("partials/footer.html")
          .then((r) => r.text())
          .then((data) => (document.getElementById("footer").innerHTML = data));
      });
    </script>
  </body>
</html>
