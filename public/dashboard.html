<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="row align-items-center mb-5">
        <div class="col-md-8">
          <h1 class="display-5 fw-bold">
            Hola, <span id="username" class="text-warning">...</span>
          </h1>
          <div class="d-flex gap-2 mt-2">
            <button id="btnDashLogout" class="btn btn-sm btn-outline-danger">
              Cerrar Sesión
            </button>
            <div id="admin-btn-container"></div>
          </div>
        </div>
        <div class="col-md-4 mt-4 mt-md-0">
          <div class="card bg-secondary text-white border-0 shadow-sm">
            <div class="card-body py-4 text-md-end">
              <small class="text-uppercase opacity-75">Saldo Disponible</small>
              <h2 class="fw-bold mb-0"><span id="saldo">0.00</span> €</h2>
            </div>
          </div>
        </div>
      </div>

      <section
        class="mb-5 p-4 bg-dark rounded border border-secondary shadow-sm"
      >
        <h4 class="mb-4 text-info">💰 Gestión de Saldo</h4>
        <div class="row g-3">
          <div class="col-md-4">
            <input
              type="number"
              id="walletAmount"
              class="form-control"
              placeholder="0.00"
            />
          </div>
          <div class="col-md-4 col-6">
            <button id="btnDeposit" class="btn btn-success w-100 fw-bold">
              📥 INGRESAR
            </button>
          </div>
          <div class="col-md-4 col-6">
            <button id="btnWithdraw" class="btn btn-danger w-100 fw-bold">
              📤 RETIRAR
            </button>
          </div>
        </div>
      </section>

      <section class="mb-5">
        <div class="card bg-black border-secondary">
          <div
            class="card-header border-secondary d-flex justify-content-between align-items-center bg-dark"
          >
            <h5 class="m-0 small fw-bold text-uppercase">
              Últimos Movimientos
            </h5>
            <div class="btn-group btn-group-sm">
              <button
                class="btn btn-outline-secondary active"
                onclick="filtrar('todos', this)"
              >
                Todos
              </button>
              <button
                class="btn btn-outline-success"
                onclick="filtrar('ingreso', this)"
              >
                Ingresos
              </button>
              <button
                class="btn btn-outline-danger"
                onclick="filtrar('retiro', this)"
              >
                Retiros
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-dark table-hover mb-0 small">
              <thead>
                <tr class="text-white-50">
                  <th>Fecha</th>
                  <th>Tipo</th>
                  <th class="text-end">Monto</th>
                  <th class="text-end text-info">Saldo Final</th>
                </tr>
              </thead>
              <tbody id="txTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="mb-5">
        <div class="card bg-black border-info shadow-sm">
          <div class="card-header bg-dark border-info text-info fw-bold small">
            💬 CENTRO DE SOPORTE
          </div>
          <div class="card-body">
            <div
              id="chatHistory"
              class="mb-3 p-3 rounded"
              style="max-height: 200px; overflow-y: auto; background: #0a0a0a"
            ></div>
            <div class="input-group">
              <input
                type="text"
                id="supportMsg"
                class="form-control bg-secondary text-white border-0"
                placeholder="¿Dudas?"
              />
              <button onclick="enviarSoporte()" class="btn btn-info fw-bold">
                ENVIAR
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="m-0">🎮 Sala de Juegos</h3>
          <a
            href="../Instrucciones/index.html"
            class="btn btn-sm btn-outline-info fw-bold"
            onclick="if(window.AudioManager) AudioManager.play('click')"
            >📘 VER REGLAS</a
          >
        </div>
        <div class="row g-4 text-center">
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-3 mb-2">🎡</div>
              <h5>Ruleta</h5>
              <a
                href="games/Ruleta/index.html"
                class="btn btn-warning mt-auto fw-bold text-dark"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-3 mb-2">🎰</div>
              <h5>Tragaperras</h5>
              <a
                href="games/Tragaperras/index.html"
                class="btn btn-danger mt-auto fw-bold"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div
              class="card bg-secondary border-warning h-100 p-4 shadow-hover"
            >
              <div class="display-3 mb-2">🚀</div>
              <h5>CRASH</h5>
              <a
                href="games/Crash/index.html"
                class="btn btn-warning mt-auto fw-bold text-dark"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >JUGAR</a
              >
            </div>
          </div>

          <div class="col-md-4">
            <div
              class="card bg-primary bg-gradient border-0 h-100 p-4 shadow-hover"
            >
              <div class="display-3 mb-2">🃏</div>
              <h5 class="fw-bold">Poker Club</h5>
              <p class="small text-white-50">Clásico & Texas Hold'em</p>
              <a
                href="games/Poker/index.html"
                class="btn btn-light mt-auto fw-bold text-primary"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >ENTRAR</a
              >
            </div>
          </div>

          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-3 mb-2">🃏</div>
              <h5>Blackjack</h5>
              <a
                href="games/Blackjack/index.html"
                class="btn btn-success mt-auto fw-bold"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >JUGAR</a
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-secondary border-0 h-100 p-4 shadow-hover">
              <div class="display-3 mb-2">🐎</div>
              <h5>Carrera</h5>
              <a
                href="games/Carrera/index.html"
                class="btn btn-primary mt-auto fw-bold"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                >JUGAR</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/AudioManager.js"></script>
    <script src="assets/js/navbar_logic.js"></script>
    <script>
      let transacciones = [];

      function cargarTodo() {
        fetch("api.php?action=get_user_info&t=" + Date.now())
          .then((r) => r.json())
          .then((data) => {
            if (!data.logged_in) return window.location.replace("login.html");
            document.getElementById("username").textContent = data.username;
            document.getElementById("saldo").textContent = parseFloat(
              data.saldo
            ).toFixed(2);
            if (data.rol === "admin" || data.rol === "owner") {
              const txt =
                data.rol === "owner" ? "👑 Panel OWNER" : "👮 Panel ADMIN";
              document.getElementById(
                "admin-btn-container"
              ).innerHTML = `<a href="partials/admin.html" class="btn btn-outline-warning btn-sm fw-bold" onclick="if(window.AudioManager) AudioManager.play('click')">${txt}</a>`;
            }
            cargarHistorial();
            cargarMisMensajes();
          });
      }

      document.addEventListener("DOMContentLoaded", cargarTodo);
      window.onpageshow = function (e) {
        if (e.persisted) cargarTodo();
      };

      function procesar(action) {
        const amount = parseFloat(
          document.getElementById("walletAmount").value
        );
        if (!amount || amount <= 0) return alert("Cantidad no válida");
        fetch(`api.php?action=${action}`, {
          method: "POST",
          body: JSON.stringify({ amount }),
          headers: { "Content-Type": "application/json" },
        })
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              if (window.AudioManager) AudioManager.play("chips");
              cargarTodo();
            } else alert("Error");
          });
      }

      function cargarHistorial() {
        fetch("api.php?action=get_transactions&t=" + Date.now())
          .then((r) => r.json())
          .then((d) => {
            if (d.success) {
              transacciones = d.transacciones;
              renderTabla(transacciones);
            }
          });
      }

      function renderTabla(lista) {
        const body = document.getElementById("txTableBody");
        if (!lista.length)
          return (body.innerHTML =
            '<tr><td colspan="4" class="text-center py-4 opacity-50">Sin movimientos.</td></tr>');
        body.innerHTML = lista
          .map((t) => {
            const esGanancia = t.tipo === "ingreso" || t.tipo === "ganancia";
            const color = esGanancia ? "text-success" : "text-danger";
            const signo = esGanancia ? "+" : "-";

            return `<tr>
                    <td class="text-white-50 small">${new Date(
                      t.fecha
                    ).toLocaleString()}</td>
                    <td class="text-uppercase" style="font-size:0.6rem">${
                      t.tipo
                    }</td>
                    <td class="text-end fw-bold ${color}">${signo}${parseFloat(
              t.cantidad
            ).toFixed(2)} €</td>
                    <td class="text-end fw-bold text-info">${parseFloat(
                      t.saldo_posterior
                    ).toFixed(2)} €</td>
                </tr>`;
          })
          .join("");
      }

      function filtrar(tipo, btn) {
        if (window.AudioManager) AudioManager.play("click");
        document
          .querySelectorAll(".btn-group .btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderTabla(
          tipo === "todos"
            ? transacciones
            : transacciones.filter((t) =>
                tipo === "ingreso"
                  ? t.tipo === "ingreso" || t.tipo === "ganancia"
                  : t.tipo === "retiro" || t.tipo === "apuesta"
              )
        );
      }

      function cargarMisMensajes() {
        fetch("api.php?action=get_my_messages&t=" + Date.now())
          .then((r) => r.json())
          .then((d) => {
            const container = document.getElementById("chatHistory");
            if (!d.mensajes || !d.mensajes.length)
              return (container.innerHTML =
                '<p class="text-center text-white-50 small py-3">Sin mensajes.</p>');
            container.innerHTML = d.mensajes
              .map(
                (m) =>
                  `<div class="mb-2"><div class="text-end"><small class="bg-secondary px-2 py-1 rounded">Tú: ${
                    m.mensaje
                  }</small></div>${
                    m.respuesta
                      ? `<div class="text-start mt-1"><small class="bg-info text-dark px-2 py-1 rounded fw-bold">ADMIN: ${m.respuesta}</small></div>`
                      : ""
                  }</div>`
              )
              .join("");
          });
      }

      function enviarSoporte() {
        if (window.AudioManager) AudioManager.play("click");
        const msg = document.getElementById("supportMsg").value;
        if (!msg) return;
        fetch("api.php?action=send_support_message", {
          method: "POST",
          body: JSON.stringify({ mensaje: msg }),
          headers: { "Content-Type": "application/json" },
        }).then(() => {
          document.getElementById("supportMsg").value = "";
          cargarMisMensajes();
        });
      }

      document
        .getElementById("btnDeposit")
        .addEventListener("click", () => procesar("deposit"));
      document.getElementById("btnWithdraw").addEventListener("click", () => {
        if (confirm("¿Retirar dinero?")) procesar("withdraw");
      });
      document.getElementById("btnDashLogout").addEventListener("click", () => {
        if (window.AudioManager) AudioManager.play("click");
        localStorage.clear();
        fetch("api.php?action=logout").then(() =>
          window.location.replace("index.html")
        );
      });
    </script>
  </body>
</html>
