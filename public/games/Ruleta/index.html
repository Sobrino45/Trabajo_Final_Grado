<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ruleta Europea | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="ruleta.css" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>
    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-5 text-center">
          <div class="mb-3 text-start">
            <a
              href="../../dashboard.html"
              class="btn btn-outline-secondary btn-sm"
              >⬅ Volver</a
            >
          </div>
          <h2 class="mb-4 text-uppercase fw-bold">🎰 Ruleta Europea</h2>
          <div class="ruleta-container mb-4">
            <div class="flecha">▼</div>
            <div id="ruleta" class="ruleta"></div>
          </div>
          <div class="card bg-secondary border-0 shadow-sm">
            <div class="card-body">
              <h6 class="text-uppercase text-white-50 small fw-bold mb-3">
                Historial
              </h6>
              <div
                id="resultados"
                class="d-flex justify-content-center gap-2 flex-wrap"
              ></div>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card bg-secondary border-0 shadow-lg">
            <div
              class="card-header bg-black d-flex justify-content-between align-items-center"
            >
              <h5 class="m-0">Mesa de Apuestas</h5>
              <div
                id="walletDisplay"
                class="text-success fw-bold font-monospace fs-5"
              >
                0.00 €
              </div>
              <button
                id="btnLimpiar"
                class="btn btn-sm btn-danger fw-bold"
                disabled
              >
                🗑 Limpiar Mesa
              </button>
            </div>

            <div class="card-body p-4 text-center">
              <div
                class="mb-4 p-3 rounded bg-dark border border-secondary shadow"
              >
                <p class="text-warning small fw-bold text-uppercase mb-2">
                  Sectores del Cilindro
                </p>
                <div class="row g-2 justify-content-center">
                  <div class="col-4">
                    <button
                      class="btn btn-dark border-warning w-100 py-2 btn-seccion"
                      onclick="apostarPorSeccion('voisins')"
                    >
                      <small class="fw-bold d-block">VOISINS</small>
                      <span class="badge bg-warning text-dark">17 Fichas</span>
                    </button>
                  </div>
                  <div class="col-4">
                    <button
                      class="btn btn-dark border-info w-100 py-2 btn-seccion"
                      onclick="apostarPorSeccion('orphelins')"
                    >
                      <small class="fw-bold d-block">ORPHELINS</small>
                      <span class="badge bg-info text-dark">8 Fichas</span>
                    </button>
                  </div>
                  <div class="col-4">
                    <button
                      class="btn btn-dark border-danger w-100 py-2 btn-seccion"
                      onclick="apostarPorSeccion('tiers')"
                    >
                      <small class="fw-bold d-block">TIERS</small>
                      <span class="badge bg-danger">12 Fichas</span>
                    </button>
                  </div>
                </div>
              </div>

              <div
                class="d-flex gap-3 justify-content-center align-items-end mb-4"
              >
                <div style="width: 120px">
                  <label class="small fw-bold text-warning">Ficha (€)</label>
                  <input
                    type="number"
                    id="cantidad"
                    class="form-control text-center bg-dark text-white border-secondary"
                    value="10"
                  />
                </div>
                <button id="girar" class="btn btn-warning btn-lg fw-bold px-5">
                  ¡GIRAR! 🎡
                </button>
              </div>

              <div id="tablero" class="tablero-container"></div>

              <div
                id="resultadoContainer"
                class="mt-4 p-3 rounded bg-dark border border-secondary text-center"
                style="min-height: 70px"
              >
                <h4 id="resultado" class="m-0">Hagan juego...</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../../assets/js/AudioManager.js"></script>
    <script src="../../assets/js/ConfettiManager.js"></script>
    <script src="../../assets/js/navbar_logic.js"></script>
    <script src="ruleta.js"></script>
  </body>
</html>
