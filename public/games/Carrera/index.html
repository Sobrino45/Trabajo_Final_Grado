<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Carrera de Caballos | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="carrera.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏇</text></svg>"
    />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a
          href="../../dashboard.html"
          class="btn btn-outline-secondary btn-sm"
          onclick="if(window.AudioManager) AudioManager.play('click')"
          >⬅ Volver</a
        >
        <div class="text-center">
          <h2 class="text-warning fw-bold m-0">🐎 Hipódromo DAW</h2>
          <small class="text-white-50">Carrera Aleatoria 3 vs 3</small>
        </div>
        <div class="bg-black border border-secondary rounded px-3 py-1">
          <span class="text-secondary small fw-bold">SALDO:</span>
          <span
            id="walletDisplay"
            class="text-success fw-bold font-monospace fs-5"
            >Cargando...</span
          >
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card bg-secondary border-0 shadow-lg">
            <div
              class="card-header bg-black border-secondary d-flex justify-content-between align-items-center"
            >
              <span class="text-white fw-bold"
                >📺 Retransmisión en Directo</span
              >
              <button
                onclick="if(window.AudioManager) AudioManager.play('click'); generarNuevaCarrera();"
                id="btnNewRace"
                class="btn btn-sm btn-outline-info py-0"
                style="font-size: 0.8rem"
              >
                🔄 Nuevos Corredores
              </button>
            </div>
            <div class="card-body p-0">
              <div class="pista py-2" id="track"></div>
            </div>
          </div>
          <div
            id="raceStatus"
            class="text-center mt-3 fw-bold fs-4 text-info p-3 rounded bg-black border border-secondary"
          >
            ¡Cargando carrera...!
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card bg-black border-secondary h-100 shadow">
            <div class="card-header border-secondary bg-warning text-dark">
              <h5 class="m-0 fw-bold">🎫 Taquilla de Apuestas</h5>
            </div>
            <div class="card-body">
              <div class="mb-4">
                <label class="form-label text-warning small fw-bold"
                  >1. CORREDORES DE HOY</label
                >
                <div id="horseSelection" class="d-grid gap-2"></div>
              </div>
              <div class="mb-4">
                <label class="form-label text-warning small fw-bold"
                  >2. APUESTA (€)</label
                >
                <div class="input-group">
                  <span
                    class="input-group-text bg-dark border-secondary text-white"
                    >€</span
                  >
                  <input
                    type="number"
                    id="betAmount"
                    class="form-control bg-dark text-white border-secondary fw-bold text-center"
                    value="10"
                    min="1"
                  />
                </div>
              </div>
              <button
                id="btnStart"
                class="btn btn-success w-100 py-3 fw-bold fs-5 text-uppercase shadow"
                onclick="if(window.AudioManager) AudioManager.play('click')"
                disabled
              >
                🏁 Iniciar Carrera
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../../assets/js/AudioManager.js"></script>
    <script src="../../assets/js/ConfettiManager.js"></script>
    <script src="../../assets/js/navbar_logic.js"></script>
    <script src="carrera.js"></script>

    <script>
      fetch("../../partials/navbar.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("navbar").innerHTML = h;
          if (window.NavbarManager) NavbarManager.init();
        });
    </script>
  </body>
</html>
