<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Blackjack Pro | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="blackjack.css" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="row mb-4 align-items-center">
        <div class="col-md-6">
          <a
            href="../../dashboard.html"
            class="btn btn-outline-secondary btn-sm"
            onclick="if (window.AudioManager) AudioManager.play('click');"
            >⬅ Volver</a
          >
          <span
            id="server-status"
            class="ms-3 badge bg-dark border border-secondary text-secondary"
            >Comprobando motor...</span
          >
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
          <div
            class="d-inline-block bg-black border border-secondary rounded px-3 py-2"
          >
            <span
              class="text-uppercase small text-secondary fw-bold"
              style="font-size: 0.6rem"
              >Saldo Real:</span
            >
            <span
              id="walletDisplay"
              class="text-success fw-bold font-monospace fs-4"
              >0.00 €</span
            >
          </div>
        </div>
      </div>

      <div
        class="game-table rounded-5 p-4 p-md-5 mb-5 shadow-lg border border-success border-opacity-25"
      >
        <div class="dealer-area mb-5 text-center">
          <h6 class="text-white-50 text-uppercase letter-spacing-2">
            Banca <span id="dealer-score" class="badge bg-dark">?</span>
          </h6>
          <div
            id="dealer-cards"
            class="cards-container d-flex justify-content-center gap-3 mt-3"
          ></div>
        </div>

        <div
          id="game-message"
          class="alert d-none text-center fw-bold shadow-lg"
        ></div>

        <div class="player-area mt-5 text-center">
          <div
            id="player-cards"
            class="cards-container d-flex justify-content-center gap-3 mb-3"
          ></div>
          <h6 class="text-white-50 text-uppercase letter-spacing-2">
            Tus Cartas <span id="player-score" class="badge bg-primary">0</span>
          </h6>
        </div>
      </div>

      <div class="row justify-content-center">
        <div id="betting-panel" class="col-md-5">
          <div class="card bg-secondary border-0 p-3 shadow">
            <label class="small fw-bold text-warning mb-2">APUESTA (€)</label>
            <input
              type="number"
              id="betAmount"
              class="form-control form-control-lg bg-dark text-white border-0 text-center mb-3"
              value="50"
              min="10"
            />
            <button
              id="btnDeal"
              class="btn btn-warning btn-lg w-100 fw-bold"
              onclick="if (window.AudioManager) AudioManager.play('click');"
            >
              REPARTIR CARTAS
            </button>
          </div>
        </div>

        <div id="action-panel" class="col-md-8 d-none text-center">
          <div class="d-flex justify-content-center gap-3">
            <button
              id="btnHit"
              class="btn btn-primary btn-lg px-4 fw-bold"
              onclick="if (window.AudioManager) AudioManager.play('click');"
            >
              PEDIR
            </button>
            <button
              id="btnStand"
              class="btn btn-danger btn-lg px-4 fw-bold"
              onclick="if (window.AudioManager) AudioManager.play('click');"
            >
              PLANTARSE
            </button>
            <button
              id="btnDouble"
              class="btn btn-info btn-lg px-4 fw-bold"
              onclick="if (window.AudioManager) AudioManager.play('click');"
            >
              DOBLAR
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="../../assets/js/AudioManager.js"></script>
    <script src="../../assets/js/ConfettiManager.js"></script>
    <script src="../../assets/js/navbar_logic.js"></script>
    <script src="blackjack.js"></script>
    <script>
      fetch("../../partials/navbar.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("navbar").innerHTML = h;
          if (window.NavbarManager) window.NavbarManager.init();
        });
    </script>
  </body>
</html>
