<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Texas Hold'em Pro | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌵</text></svg>"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/main.css" />
    <link rel="stylesheet" href="texas.css" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <div class="row mb-4 align-items-center">
        <div class="col-6">
          <a
            href="../index.html"
            class="btn btn-outline-secondary btn-sm"
            onclick="if (window.AudioManager) AudioManager.play('click');"
            >⬅ Lobby</a
          >
        </div>
        <div class="col-6 text-end">
          <div
            class="bg-black border border-secondary rounded px-3 py-1 d-inline-block shadow-sm"
          >
            <span
              id="nav-saldo"
              class="text-success fw-bold font-monospace fs-5"
              >0.00 €</span
            >
          </div>
        </div>
      </div>

      <div class="texas-table p-5 shadow-lg position-relative">
        <div id="game-phase" class="phase-indicator">ESPERANDO APUESTA</div>

        <div class="text-center mb-5">
          <div class="area-label">Banca / Dealer</div>
          <div id="dealer-cards" class="d-flex justify-content-center gap-3">
            <div class="card-texas back"></div>
            <div class="card-texas back"></div>
          </div>
        </div>

        <div class="community-cards-box mx-auto mb-5" style="max-width: 700px">
          <div id="community-area" class="d-flex gap-3">
            <span class="text-white-50 small opacity-50"
              >FLOP · TURN · RIVER</span
            >
          </div>
        </div>

        <div
          id="poker-message"
          class="text-center mb-5 fw-bold fs-3 text-warning"
        >
          ¡HAGAN SUS APUESTAS!
        </div>

        <div class="text-center">
          <div
            id="player-cards"
            class="d-flex justify-content-center gap-3 mb-3"
          >
            <div class="card-texas back"></div>
            <div class="card-texas back"></div>
          </div>
          <div class="area-label">Tus Cartas</div>
        </div>
      </div>

      <div class="row justify-content-center mt-4">
        <div class="col-md-8">
          <div class="card bg-secondary border-0 p-3 shadow">
            <div class="row g-3 align-items-center">
              <div class="col-md-4">
                <div class="input-group">
                  <span class="input-group-text bg-dark border-0 text-info"
                    >€</span
                  >
                  <input
                    type="number"
                    id="betAmount"
                    class="form-control bg-dark text-white border-0 text-center fw-bold"
                    value="20"
                    min="5"
                  />
                </div>
              </div>
              <div class="col-md-8 d-flex gap-2">
                <button
                  id="btnAction"
                  class="btn btn-warning flex-grow-1 fw-bold btn-texas"
                  onclick="if (window.AudioManager) AudioManager.play('click');"
                >
                  REPARTIR
                </button>
                <button
                  id="btnFold"
                  class="btn btn-outline-danger fw-bold btn-texas d-none"
                  onclick="if (window.AudioManager) AudioManager.play('click');"
                >
                  RETIRARSE
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../../../assets/js/AudioManager.js"></script>
    <script src="../../assets/js/ConfettiManager.js"></script>
    <script src="../../../assets/js/navbar_logic.js"></script>
    <script src="texas.js"></script>
    <script>
      fetch("../../../partials/navbar.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("navbar").innerHTML = h;
          if (window.NavbarManager) window.NavbarManager.init();
        });
    </script>
  </body>
</html>
