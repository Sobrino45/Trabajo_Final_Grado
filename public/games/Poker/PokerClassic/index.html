<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Poker Classic Duel | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/main.css" />
    <link rel="stylesheet" href="poker.css" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <div class="row mb-4 align-items-center">
        <div class="col-6">
          <a
            href="../index.html"
            class="btn btn-outline-secondary btn-sm"
            onclick="if(window.AudioManager) AudioManager.play('click')"
            >⬅ Lobby</a
          >
        </div>
        <div class="col-6 text-end">
          <div
            class="bg-black border border-secondary rounded px-3 py-1 d-inline-block"
          >
            <span
              id="nav-saldo"
              class="text-success fw-bold font-monospace fs-5"
              >0.00 €</span
            >
          </div>
        </div>
      </div>

      <div
        class="poker-table rounded-4 p-4 shadow-lg border border-info border-opacity-25"
      >
        <div class="text-center mb-4">
          <div class="small text-white-50 mb-2">BANCA</div>
          <div id="dealer-cards" class="d-flex justify-content-center gap-2">
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
          </div>
        </div>

        <div
          id="poker-message"
          class="text-center mb-4 fw-bold fs-4 text-warning"
          style="min-height: 40px"
        >
          DUELO CONTRA LA CASA
        </div>

        <div class="text-center mb-5">
          <div
            id="cards-container"
            class="d-flex justify-content-center gap-2 mb-2"
          >
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
            <div class="poker-card-placeholder"></div>
          </div>
          <div class="small text-info mt-2">TU MANO</div>
        </div>

        <div class="row justify-content-center g-3 align-items-center">
          <div class="col-md-3">
            <div class="input-group">
              <span class="input-group-text bg-dark border-secondary text-info"
                >€</span
              >
              <input
                type="number"
                id="betAmount"
                class="form-control bg-dark text-white border-secondary text-center fw-bold"
                value="10"
                min="1"
              />
            </div>
          </div>
          <div class="col-md-4">
            <button
              id="btnAction"
              class="btn btn-info btn-lg w-100 fw-bold shadow"
              onclick="if(window.AudioManager) AudioManager.play('click')"
            >
              REPARTIR
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="../../../assets/js/AudioManager.js"></script>
    <script src="../../assets/js/ConfettiManager.js"></script>
    <script src="../../../assets/js/navbar_logic.js"></script>
    <script src="poker.js"></script>
    <script>
      fetch("../../../partials/navbar.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("navbar").innerHTML = h;
          if (window.NavbarManager) window.NavbarManager.init();
        });
    </script>
  </body>
</html>
