<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Historial | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="icon" type="image/png" href="assets/img/icons/logo-casino.png" />
  </head>
  <body class="bg-dark text-light">
    <div id="navbar"></div>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-warning">📜 Historial de Transacciones</h2>
        <a href="dashboard.html" class="btn btn-outline-secondary"
          >⬅ Volver al Dashboard</a
        >
      </div>

      <div id="admin-summary" class="row mb-4 d-none">
        <div class="col-md-12">
          <div class="card bg-warning text-dark">
            <div
              class="card-body d-flex justify-content-between align-items-center"
            >
              <div>
                <h4 class="card-title fw-bold">🏦 BENEFICIO NETO DEL CASINO</h4>
                <p class="mb-0">
                  Total ganado por la casa (Pérdidas de usuarios)
                </p>
              </div>
              <h1 class="display-4 fw-bold" id="casino-profit">0.00 €</h1>
            </div>
          </div>
        </div>
      </div>

      <div class="card bg-secondary text-white border-0 shadow">
        <div class="card-body">
          <div class="table-responsive">
            <table
              class="table table-dark table-hover align-middle text-center"
            >
              <thead>
                <tr id="table-header">
                  <th>Fecha</th>
                  <th>Juego</th>
                  <th>Apuesta</th>
                  <th>Premio</th>
                  <th>Neto</th>
                </tr>
              </thead>
              <tbody id="history-body">
                <tr>
                  <td colspan="5" class="text-center">Cargando datos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/navbar_logic.js"></script>
    <script>
      // Cargar Navbar
      fetch("partials/navbar.html")
        .then((r) => r.text())
        .then((h) => {
          document.getElementById("navbar").innerHTML = h;
          if (window.NavbarManager) NavbarManager.init();
        });

      document.addEventListener("DOMContentLoaded", () => {
        const tbody = document.getElementById("history-body");
        const thead = document.getElementById("table-header");

        fetch("../Backend/get_history.php")
          .then((r) => {
            // Si el servidor da error (ej: 500 o 404), lanzamos error
            if (!r.ok) throw new Error(`Error HTTP: ${r.status}`);
            return r.text(); // Leemos como texto primero para ver si es JSON o error PHP
          })
          .then((text) => {
            try {
              return JSON.parse(text); // Intentamos convertir a JSON
            } catch (e) {
              // Si falla, es que PHP devolvió texto (error fatal)
              console.error("Respuesta cruda del servidor:", text);
              throw new Error(
                "El servidor devolvió un error (no es JSON válido). Revisa la consola."
              );
            }
          })
          .then((response) => {
            if (!response.authorized) {
              window.location.href = "login.html";
              return;
            }

            tbody.innerHTML = "";
            let casinoTotalProfit = 0;

            // Lógica ADMIN
            if (response.role === "admin") {
              const thUser = document.createElement("th");
              thUser.textContent = "Usuario";
              thead.insertBefore(thUser, thead.firstChild);
              document
                .getElementById("admin-summary")
                .classList.remove("d-none");
            }

            // Renderizar filas
            response.data.forEach((row) => {
              const tr = document.createElement("tr");
              const apuesta = parseFloat(row.apuesta);
              const premio = parseFloat(row.ganancia);
              const netoUsuario = premio - apuesta;
              const netoCasino = apuesta - premio;
              casinoTotalProfit += netoCasino;

              const colorNeto =
                netoUsuario >= 0 ? "text-success" : "text-danger";
              const signo = netoUsuario >= 0 ? "+" : "";

              let htmlCells = `
                            <td>${new Date(row.fecha).toLocaleString()}</td>
                            <td>${row.juego}</td>
                            <td>${apuesta.toFixed(2)} €</td>
                            <td>${premio.toFixed(2)} €</td>
                            <td class="fw-bold ${colorNeto}">${signo}${netoUsuario.toFixed(
                2
              )} €</td>
                        `;

              if (response.role === "admin") {
                htmlCells = `<td>👤 ${row.username}</td>` + htmlCells;
              }

              tr.innerHTML = htmlCells;
              tbody.appendChild(tr);
            });

            // Actualizar panel admin
            if (response.role === "admin") {
              const profitDisplay = document.getElementById("casino-profit");
              profitDisplay.textContent = casinoTotalProfit.toFixed(2) + " €";
              profitDisplay.className = `display-4 fw-bold ${
                casinoTotalProfit >= 0 ? "text-success" : "text-danger"
              }`;
            }

            if (response.data.length === 0) {
              const cols = response.role === "admin" ? 6 : 5;
              tbody.innerHTML = `<tr><td colspan="${cols}" class="text-center text-muted py-4">No hay partidas registradas aún. ¡Juega algo!</td></tr>`;
            }
          })
          .catch((error) => {
            console.error("Error grave:", error);
            // AQUÍ MOSTRAMOS EL ERROR EN PANTALLA
            tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center text-danger py-4">
                                <strong>⚠️ Error cargando historial:</strong><br>
                                ${error.message}<br>
                                <small class="text-muted">Verifica que la tabla 'historial' exista en la BD.</small>
                            </td>
                        </tr>
                    `;
          });
      });
    </script>
  </body>
</html>
