<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Panel Supremo | Casino DAW</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body class="bg-dark text-light">
    <nav
      class="navbar navbar-dark bg-black border-bottom border-secondary mb-4"
    >
      <div class="container">
        <span class="navbar-brand fw-bold text-warning" id="role-badge"
          ><i class="bi bi-shield-lock-fill"></i> CARGANDO...</span
        >
        <div class="d-flex align-items-center gap-3">
          <span
            id="msg-badge"
            class="badge bg-danger rounded-pill d-none"
            style="font-size: 0.8rem"
          ></span>
          <a
            href="../dashboard.html"
            class="btn btn-outline-light btn-sm"
            onclick="if(window.AudioManager) AudioManager.play('click')"
            >⬅ DASHBOARD</a
          >
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row mb-4 g-4 text-center">
        <div class="col-md-4">
          <div class="card bg-secondary border-0 p-3 shadow-sm">
            <small class="text-white-50">Usuarios</small>
            <h2 id="totalUsers">0</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card bg-secondary border-0 p-3 shadow-sm">
            <small class="text-warning">Dinero en Juego</small>
            <h2 class="text-warning" id="totalMoney">0.00 €</h2>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card bg-secondary border-0 p-3 shadow-sm">
            <small class="text-info">Tickets Pendientes</small>
            <h2 class="text-info" id="totalSupport">0</h2>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card bg-black border-secondary mb-4 shadow">
            <div
              class="card-header border-secondary d-flex justify-content-between align-items-center bg-dark"
            >
              <h5 class="m-0 small fw-bold">GESTIÓN DE USUARIOS</h5>
              <button
                onclick="cargarDatosAdmin()"
                class="btn btn-sm btn-outline-info"
              >
                <i class="bi bi-arrow-clockwise"></i> REFRESCAR
              </button>
            </div>
            <div class="table-responsive">
              <table
                class="table table-dark table-hover mb-0 small align-middle"
              >
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Rango</th>
                    <th class="text-end">Saldo</th>
                    <th class="text-center">Editar</th>
                  </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card bg-black border-info shadow">
            <div
              class="card-header bg-dark border-info text-info fw-bold small"
            >
              <i class="bi bi-chat-dots"></i> TICKETS DE SOPORTE
            </div>
            <div class="table-responsive" style="max-height: 300px">
              <table class="table table-dark table-sm align-middle mb-0 small">
                <tbody id="supportTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card bg-black border-warning shadow h-100">
            <div
              class="card-header bg-dark border-warning text-warning fw-bold small"
            >
              <i class="bi bi-incognito"></i> AUDITORÍA DE ACCESOS (IPs)
            </div>
            <div class="card-body p-0">
              <div
                id="logsContainer"
                class="list-group list-group-flush"
                style="max-height: 600px; overflow-y: auto"
              >
                <p class="text-center py-4 text-white-50">
                  Cargando registros...
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary text-light">
          <div class="modal-body p-4 text-center">
            <input type="hidden" id="edit-id" />
            <div class="mb-3">
              <label class="small text-white-50">Usuario</label>
              <input
                type="text"
                id="edit-username"
                class="form-control bg-secondary text-white border-0"
              />
            </div>
            <div class="mb-3">
              <label class="small text-warning">Saldo (€)</label>
              <input
                type="number"
                step="0.01"
                id="edit-saldo"
                class="form-control bg-secondary text-white border-0 fw-bold"
              />
            </div>
            <button
              onclick="guardarCambiosUsuario()"
              class="btn btn-success w-100 fw-bold"
            >
              GUARDAR CAMBIOS
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/AudioManager.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let usuariosCache = [];
      const editModal = new bootstrap.Modal(
        document.getElementById("editModal")
      );
      const API = "/CasinoDaw/public/api.php";

      function cargarDatosAdmin() {
        fetch(`${API}?action=admin_get_data&t=${Date.now()}`)
          .then((r) => r.json())
          .then((data) => {
            if (!data.success)
              return (window.location.href = "../dashboard.html");

            document.getElementById(
              "role-badge"
            ).innerHTML = `<i class="bi bi-shield-check"></i> PANEL ${data.mi_rol.toUpperCase()}`;

            document.getElementById("totalUsers").textContent =
              data.stats.total_usuarios || 0;
            document.getElementById("totalMoney").textContent =
              (data.stats.dinero_en_juego || 0).toFixed(2) + " €";
            document.getElementById("totalSupport").textContent =
              data.stats.pendientes || 0;

            const badge = document.getElementById("msg-badge");
            if (data.stats.pendientes > 0) {
              badge.textContent = `${data.stats.pendientes} tickets`;
              badge.classList.remove("d-none");
            } else {
              badge.classList.add("d-none");
            }

            usuariosCache = data.usuarios;
            renderUsuarios(data.usuarios, data.mi_rol);
            renderLogs(data.logs);
            cargarMensajesSoporte();
          });
      }

      function renderUsuarios(lista, miRol) {
        const tbody = document.getElementById("userTableBody");
        tbody.innerHTML = lista
          .map(
            (u) => `
          <tr>
            <td>#${u.id}</td>
            <td class="fw-bold">${u.username}</td>
            <td>
              ${
                miRol === "owner"
                  ? `<select class="form-select form-select-sm bg-dark text-warning border-secondary" onchange="cambiarRango(${
                      u.id
                    }, this.value)">
                    <option value="user" ${
                      u.rol === "user" ? "selected" : ""
                    }>User</option>
                    <option value="admin" ${
                      u.rol === "admin" ? "selected" : ""
                    }>Admin</option>
                    <option value="owner" ${
                      u.rol === "owner" ? "selected" : ""
                    }>Owner</option>
                   </select>`
                  : `<span class="badge bg-secondary">${u.rol}</span>`
              }
            </td>
            <td class="text-end fw-bold">${parseFloat(u.saldo).toFixed(
              2
            )} €</td>
            <td class="text-center">
              <button onclick="abrirModalEditar(${
                u.id
              })" class="btn btn-sm btn-outline-warning">
                <i class="bi bi-pencil"></i>
              </button>
            </td>
          </tr>
        `
          )
          .join("");
      }

      function renderLogs(logs) {
        const container = document.getElementById("logsContainer");
        if (!logs || logs.length === 0) {
          container.innerHTML =
            '<p class="text-center py-4 text-white-50 small">Sin registros recientes.</p>';
          return;
        }
        container.innerHTML = logs
          .map(
            (l) => `
          <div class="list-group-item bg-black border-secondary text-light py-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="text-info fw-bold">${l.username}</span>
              <span class="badge bg-dark border border-secondary text-white-50" style="font-size:0.6rem">${
                l.ip_address
              }</span>
            </div>
            <div class="small text-white-50" style="font-size:0.7rem">
              <i class="bi bi-clock"></i> ${new Date(l.fecha).toLocaleString()}
            </div>
            <div class="small text-truncate text-muted mt-1" style="font-size:0.6rem" title="${
              l.user_agent
            }">
              ${l.user_agent}
            </div>
          </div>
        `
          )
          .join("");
      }

      function cargarMensajesSoporte() {
        fetch(`${API}?action=admin_get_messages&t=${Date.now()}`)
          .then((r) => r.json())
          .then((d) => {
            const body = document.getElementById("supportTableBody");
            if (!d.mensajes || !d.mensajes.length) {
              body.innerHTML =
                '<tr><td class="text-center py-3">No hay mensajes.</td></tr>';
              return;
            }
            body.innerHTML = d.mensajes
              .map(
                (m) => `
              <tr class="${
                m.leido == 0
                  ? "bg-dark fw-bold border-start border-danger border-3"
                  : "opacity-50"
              }">
                <td class="ps-3 py-2">
                  <span class="text-info">${m.username}</span><br>
                  <small class="text-white-50">${m.mensaje}</small>
                </td>
                <td class="px-2">
                  ${
                    m.respuesta
                      ? `<small class="text-success"><i class="bi bi-check-all"></i> ${m.respuesta}</small>`
                      : `<div class="input-group input-group-sm">
                        <input type="text" id="reply-${m.id}" class="form-control bg-dark text-white border-secondary" placeholder="Respuesta...">
                        <button onclick="responder(${m.id})" class="btn btn-info py-0">ENVIAR</button>
                       </div>`
                  }
                </td>
              </tr>
            `
              )
              .join("");
          });
      }

      function responder(id) {
        if (window.AudioManager) AudioManager.play("click");
        const res = document.getElementById(`reply-${id}`).value;
        if (!res) return;
        fetch(`${API}?action=admin_reply_message`, {
          method: "POST",
          body: JSON.stringify({ id, respuesta: res }),
          headers: { "Content-Type": "application/json" },
        }).then(() => cargarDatosAdmin());
      }

      function abrirModalEditar(id) {
        if (window.AudioManager) AudioManager.play("click");
        const u = usuariosCache.find((x) => x.id === id);
        document.getElementById("edit-id").value = u.id;
        document.getElementById("edit-username").value = u.username;
        document.getElementById("edit-saldo").value = u.saldo;
        editModal.show();
      }

      function guardarCambiosUsuario() {
        if (window.AudioManager) AudioManager.play("click");
        fetch(`${API}?action=admin_update_user`, {
          method: "POST",
          body: JSON.stringify({
            id: document.getElementById("edit-id").value,
            username: document.getElementById("edit-username").value,
            saldo: document.getElementById("edit-saldo").value,
          }),
          headers: { "Content-Type": "application/json" },
        }).then(() => {
          editModal.hide();
          cargarDatosAdmin();
        });
      }

      function cambiarRango(id, nuevo_rol) {
        if (window.AudioManager) AudioManager.play("click");
        fetch(`${API}?action=admin_change_role`, {
          method: "POST",
          body: JSON.stringify({ id, nuevo_rol }),
          headers: { "Content-Type": "application/json" },
        }).then(() => cargarDatosAdmin());
      }

      document.addEventListener("DOMContentLoaded", cargarDatosAdmin);
    </script>
  </body>
</html>
