<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Portal/assets/css/main.css">
    
    <link rel="stylesheet" href="blackjack.css">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
</head>
<body class="bg-dark text-light">

    <div id="navbar"></div>

    <main class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="../Portal/dashboard.html" class="btn btn-outline-secondary btn-sm">⬅ Volver</a>
            <h2 class="text-warning fw-bold m-0">Blackjack Pro</h2>
            <div class="bg-black border border-secondary rounded px-3 py-1">
                <span class="text-secondary small fw-bold">SALDO:</span>
                <span id="walletDisplay" class="text-success fw-bold font-monospace fs-5">...</span>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="mesa-blackjack shadow-lg position-relative">
                    
                    <div class="text-center mb-5">
                        <div class="badge bg-danger mb-2">CROUPIER</div>
                        <div id="dealer-cards" class="d-flex justify-content-center gap-2 hand-area">
                            <div class="card-placeholder"></div>
                            <div class="card-placeholder"></div>
                        </div>
                        <div id="dealer-score" class="score-badge mt-2">0</div>
                    </div>

                    <div id="game-message" class="alert alert-dark text-center fw-bold opacity-0">
                        Esperando apuesta...
                    </div>

                    <div class="text-center mt-5">
                        <div id="player-score" class="score-badge mb-2">0</div>
                        <div id="player-cards" class="d-flex justify-content-center gap-2 hand-area">
                            <div class="card-placeholder"></div>
                            <div class="card-placeholder"></div>
                        </div>
                        <div class="badge bg-primary mt-2">JUGADOR</div>
                    </div>

                </div>
            </div>

            <div class="col-lg-4">
                <div class="card bg-black border-secondary h-100 shadow">
                    <div class="card-header border-secondary bg-warning text-dark">
                        <h5 class="m-0 fw-bold">🎮 Controles</h5>
                    </div>
                    <div class="card-body d-flex flex-column gap-3">
                        
                        <div id="betting-panel">
                            <label class="form-label text-white-50 small">TU APUESTA (€)</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-dark border-secondary text-white">€</span>
                                <input type="number" id="betAmount" class="form-control bg-dark text-white border-secondary fw-bold text-center" value="50" min="10">
                            </div>
                            <button id="btnDeal" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow">
                                REPARTIR CARTAS
                            </button>
                        </div>

                        <div id="action-panel" class="d-none d-grid gap-2">
                            <button id="btnHit" class="btn btn-primary fw-bold py-2">
                                ➕ PEDIR CARTA (Hit)
                            </button>
                            <div class="row g-2">
                                <div class="col-6">
                                    <button id="btnStand" class="btn btn-warning w-100 fw-bold py-2 text-dark">
                                        ✋ PLANTARSE
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button id="btnDouble" class="btn btn-info w-100 fw-bold py-2 text-dark">
                                        💰 DOBLAR
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="mt-auto text-center">
                            <small class="text-secondary" id="server-status">🔴 Conectando con servidor...</small>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../Portal/assets/js/navbar_logic.js"></script> 
    <script src="blackjack.js"></script>

    <script>
        fetch("../Portal/partials/navbar.html").then(r => r.text()).then(h => {
            document.getElementById("navbar").innerHTML = h;
            if(window.NavbarManager) NavbarManager.init();
        });
    </script>
</body>
</html>
