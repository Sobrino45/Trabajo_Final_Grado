<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta | Casino DAW</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Portal/assets/css/main.css">
    <link rel="stylesheet" href="ruleta.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>">
</head>
<body class="bg-dark text-light">

    <div id="navbar"></div>

    <main class="container py-5">
        <div class="row g-5">
            
            <div class="col-lg-5 text-center">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="../Portal/dashboard.html" class="btn btn-outline-secondary btn-sm">
                        ⬅ Volver al Dashboard
                    </a>
                </div>

                <h1 class="mb-4 display-6">🎰 Ruleta Europea</h1>
                
                <div class="ruleta-container d-inline-block position-relative mb-4">
                    <div class="flecha">▼</div>
                    <div id="ruleta" class="ruleta">
                        <div class="ruleta-centro">
                            <div class="ruleta-cruz"></div>
                        </div>
                    </div>
                </div>

                <div class="card bg-secondary text-white shadow-sm mt-3">
                    <div class="card-body">
                        <h5 class="card-title small text-uppercase text-white-50">Historial</h5>
                        <div id="resultados" class="d-flex justify-content-center gap-2 flex-wrap"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card bg-secondary text-white border-0 shadow-lg">
                    
                    <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center">
                        <h4 class="m-0 d-none d-md-block">Mesa</h4>
                        
                        <div class="bg-dark border border-secondary rounded px-3 py-1 d-flex align-items-center gap-2 shadow-inset">
                            <span class="text-uppercase small text-secondary fw-bold" style="font-size: 0.7rem;">Tu Saldo:</span>
                            <span id="walletDisplay" class="text-success fw-bold font-monospace fs-5">Cargando...</span>
                        </div>

                        <button id="btnLimpiar" class="btn btn-sm btn-danger opacity-75" onclick="limpiarMesa()" disabled>
                            🗑 <span class="d-none d-sm-inline">Borrar</span>
                        </button>
                    </div>

                    <div class="card-body p-4 text-center">
                        
                        <div class="mb-4 d-flex gap-2 align-items-end justify-content-center flex-wrap">
                            <div style="width: 140px;">
                                <label class="form-label text-warning fw-bold small">Valor Ficha (€)</label>
                                <input type="number" id="cantidad" class="form-control text-center fw-bold" min="1" value="10">
                            </div>
                            
                            <button id="girar" class="btn btn-warning btn-lg fw-bold px-4 shadow-sm flex-grow-1" style="max-width: 200px;">
                                ¡GIRAR! 🎡
                            </button>
                        </div>

                        <div class="tablero-container mb-3">
                            <div id="tablero" class="tablero"></div>
                        </div>
                        
                        <div id="resultadoContainer" class="min-h-50 mt-3 p-3 rounded bg-dark border border-secondary" style="min-height: 100px;">
                            <h3 id="resultado" class="text-white fw-bold m-0">Hagan juego...</h3>
                            <p id="detalleGanadores" class="text-light small opacity-75 m-0 mt-2"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="ruleta.js"></script>

    <script>
        // Cargar Navbar
        fetch("../Portal/partials/navbar.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;
            });
    </script>
</body>
</html>
