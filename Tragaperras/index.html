<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tragaperras | Casino DAW</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../Portal/assets/css/main.css" />
    <link rel="stylesheet" href="tragaperras.css" />
</head>

<body class="bg-dark text-light">

    <div id="navbar"></div>

    <main class="container py-5">
        
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <a href="../Portal/dashboard.html" class="btn btn-outline-secondary btn-sm">
                    ⬅ Volver al Dashboard
                </a>
                
                <div class="bg-black border border-secondary rounded px-3 py-1 d-flex align-items-center gap-2 shadow-inset">
                    <span class="text-uppercase small text-secondary fw-bold" style="font-size: 0.7rem;">Tu Saldo:</span>
                    <span id="walletDisplay" class="text-success fw-bold font-monospace fs-5">Cargando...</span>
                </div>
            </div>
        </div>

        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-warning">🎰 Super Slots DAW</h1>
            <p class="lead text-secondary">Gira los carretes y multiplica tu dinero</p>
        </header>

        <section class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="slot-machine text-center">

                    <div class="d-flex justify-content-between px-4 mb-3 text-white-50 small fw-bold">
                        <span>COSTE: <span class="text-white">5€</span></span>
                        <span>PREMIO MÁX: <span class="text-warning">100€</span></span>
                    </div>

                    <div class="reels">
                        <div class="reel">🍒</div>
                        <div class="reel">🍋</div>
                        <div class="reel">🔔</div>
                    </div>

                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button id="spinBtn" class="btn btn-danger btn-lg w-50 fw-bold shadow-sm">
                            GIRAR (-5€)
                        </button>
                        <button id="paytableBtn" class="btn btn-outline-light">
                            ℹ️ Premios
                        </button>
                    </div>

                    <div id="result" class="result mt-3 fw-bold"></div>

                    <div id="paytable" class="paytable d-none mt-4 text-start mx-auto" style="max-width: 300px;">
                        <h6 class="text-warning border-bottom border-secondary pb-2">Tabla de pagos</h6>
                        <ul class="list-unstyled mt-2 small">
                            <li class="d-flex justify-content-between"><span>💎💎💎</span> <span class="text-warning">+100 €</span></li>
                            <li class="d-flex justify-content-between"><span>⭐⭐⭐</span> <span class="text-warning">+50 €</span></li>
                            <li class="d-flex justify-content-between"><span>🔔🔔🔔</span> <span class="text-warning">+20 €</span></li>
                            <li class="d-flex justify-content-between"><span>🍋🍋🍋</span> <span class="text-warning">+10 €</span></li>
                            <li class="d-flex justify-content-between"><span>🍒🍒🍒</span> <span class="text-warning">+5 €</span></li>
                        </ul>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Portal/assets/js/auth.js"></script>
    <script src="../Portal/assets/js/wallet.js"></script>
    <script src="../Portal/assets/js/logout.js"></script>
    
    <script src="tragaperras.js"></script>

    <script>
        // Cargar Navbar Dinámico
        fetch("../Portal/partials/navbar.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;
                if(window.NavbarManager) NavbarManager.init();
            });

        // Cargar Footer Dinámico
        fetch("../Portal/partials/footer.html")
            .then(r => r.text())
            .then(t => document.getElementById("footer").innerHTML = t);
    </script>
</body>
</html>
